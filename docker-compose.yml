services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rbi_capstone_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rbi_capstone
      POSTGRES_USER: rbi_user
      POSTGRES_PASSWORD: rbi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
